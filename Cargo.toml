[package]
name = "sql-job-monitor"
version = "0.1.0"
edition = "2021"
description = "A native monitor for SQL Server Agent jobs on Windows and macOS"
authors = ["SQL Job Monitor Contributors"]
license = "MIT"
build = "build.rs"

[features]
# Tiberius allows one TLS backend. The default speaks TLS 1.2 and 1.3 through
# rustls on every platform.
default = ["rustls-tls"]
rustls-tls = ["tiberius/rustls"]
# Opt-in, and only with `--no-default-features`. Uses a statically linked
# OpenSSL 3 (via opentls) at security level 0 so an unpatched SQL Server 2012
# that offers only TLS 1.0 can connect. See the README.
legacy-tls = ["tiberius/vendored-openssl", "dep:opentls", "dep:openssl"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.13", features = ["unstable-winit-030"] }
thiserror = "2.0"
tiberius = { version = "0.13", default-features = false, features = ["chrono", "tds73", "sql-browser-tokio"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }
# The same crates tiberius uses for `vendored-openssl`, named here so the
# legacy build can report OpenSSL's version and tests can exercise the patch.
opentls = { version = "0.2.1", optional = true }
openssl = { version = "0.10", optional = true, features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
# Integrated Windows authentication. TLS stays on the selected backend above.
tiberius = { version = "0.13", default-features = false, features = ["winauth"] }
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[build-dependencies]
slint-build = "1.13"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
pretty_assertions = "1.4"

[patch.crates-io]
# opentls 0.2.1 plus the security-level change in
# vendor/opentls/src/sync_io/connector/builder.rs. Only `legacy-tls` compiles it.
opentls = { path = "vendor/opentls" }

[package.metadata.wix]
upgrade-guid = "D2B047CC-2226-4CD7-A11D-B03911484A32"
path-guid = "18517DA9-61D7-4532-A0A4-B592FF140928"
license = false
eula = false

[profile.release]
lto = "thin"
strip = true
