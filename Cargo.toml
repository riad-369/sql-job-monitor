[package]
name = "sql-job-monitor"
version = "0.1.0"
edition = "2021"
description = "A fast native macOS monitor for SQL Server Agent jobs"
authors = ["SQL Job Monitor Contributors"]
license = "MIT"
build = "build.rs"

[features]
# Tiberius allows one TLS backend. The default speaks TLS 1.2 and 1.3 through
# rustls, which completes SQL Server's TDS-wrapped handshake on macOS.
# `native-tls` uses Secure Transport there and the server closes it.
default = ["rustls-tls"]
rustls-tls = ["tiberius/rustls"]
# Opt-in, and only with `--no-default-features`. Uses a statically linked
# OpenSSL 3 (via opentls, not Secure Transport) at security level 0 so an
# unpatched SQL Server 2012 that offers only TLS 1.0 can connect. See the README.
legacy-tls = ["tiberius/vendored-openssl", "dep:opentls", "dep:openssl"]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.13", features = ["unstable-winit-030"] }
thiserror = "2.0"
tiberius = { version = "0.13", default-features = false, features = ["chrono", "tds73", "sql-browser-tokio"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1.18", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }
# The same crates tiberius uses for `vendored-openssl`, named here so the
# legacy build can report OpenSSL's version and tests can exercise the patch.
opentls = { version = "0.2.1", optional = true }
openssl = { version = "0.10", optional = true, features = ["vendored"] }

[build-dependencies]
slint-build = "1.13"

[dev-dependencies]
pretty_assertions = "1.4"

[patch.crates-io]
# opentls 0.2.1 plus the security-level change in
# vendor/opentls/src/sync_io/connector/builder.rs. Only `legacy-tls` compiles it.
opentls = { path = "vendor/opentls" }

[profile.release]
lto = "thin"
strip = true
